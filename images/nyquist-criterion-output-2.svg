<svg xmlns="http://www.w3.org/2000/svg" width="920" height="700" viewBox="0 0 920 700" role="img" aria-labelledby="title desc">
  <title id="title">Bode Plot for L(s)=10/(s(s+2))</title>
  <desc id="desc">Magnitude and phase Bode sketch including gain crossover and phase trend for the worked example.</desc>
  <rect x="0" y="0" width="920" height="700" fill="#f8f3ed"/>
  <rect x="40" y="40" width="840" height="620" fill="#ffffff" stroke="#d6c6b8" stroke-width="2" rx="8"/>

  <text x="68" y="76" font-family="Roboto, Arial, sans-serif" font-size="26" fill="#5a4438">Bode Plot for L(s)=10/(s(s+2))</text>

  <rect x="90" y="110" width="740" height="220" fill="#fff" stroke="#d6c6b8"/>
  <line x1="90" y1="220" x2="830" y2="220" stroke="#666" stroke-width="1.2" stroke-dasharray="6 6"/>
  <path d="M110 128 C 230 142, 300 165, 410 205 C 505 238, 575 264, 650 288 C 725 308, 780 315, 820 318"
        fill="none" stroke="#7a4e35" stroke-width="4"/>
  <line x1="500" y1="110" x2="500" y2="330" stroke="#9a6c4d" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="510" y="130" font-family="Roboto, Arial, sans-serif" font-size="13" fill="#43362f">w_gc ~ 2.863 rad/s</text>
  <text x="98" y="132" font-family="Roboto, Arial, sans-serif" font-size="14" fill="#43362f">Magnitude (dB)</text>

  <rect x="90" y="390" width="740" height="220" fill="#fff" stroke="#d6c6b8"/>
  <line x1="90" y1="540" x2="830" y2="540" stroke="#666" stroke-width="1.2" stroke-dasharray="6 6"/>
  <path d="M110 430 C 220 446, 320 478, 420 520 C 520 560, 620 584, 820 602"
        fill="none" stroke="#9a6c4d" stroke-width="4"/>
  <line x1="500" y1="390" x2="500" y2="610" stroke="#9a6c4d" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="510" y="442" font-family="Roboto, Arial, sans-serif" font-size="13" fill="#43362f">Phase at w_gc ~ -145.1 deg</text>
  <text x="98" y="412" font-family="Roboto, Arial, sans-serif" font-size="14" fill="#43362f">Phase (deg)</text>

  <text x="770" y="352" font-family="Roboto, Arial, sans-serif" font-size="13" fill="#43362f">log(w)</text>
  <text x="770" y="632" font-family="Roboto, Arial, sans-serif" font-size="13" fill="#43362f">log(w)</text>
</svg>
